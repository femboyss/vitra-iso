# Vitra live session: sway as a kiosk for vitrainstall - (c) 2026 34 & Claude - GPL-3.0-or-later
# Why sway and not cage: sway can change the keyboard layout while running
# (swaymsg input type:keyboard xkb_layout de), so the layout picked in the installer
# works immediately, without restarting anything.
# No bar, no borders, no keybindings except the text console (Ctrl+Alt+F2, handled by the kernel/VT).
default_border none
default_floating_border none
focus_follows_mouse no
output * bg #0b0b0f solid_color
input type:keyboard xkb_layout us
for_window [app_id=".*"] fullscreen enable
for_window [class=".*"] fullscreen enable
exec /usr/local/bin/vitra-live-session
